{% extends 'casos/base.html' %}

{% block contenido %}
<h2>Eliminar Cliente</h2>
<p>¿Estás seguro de que deseas eliminar al cliente <strong>{{ cliente.nombres }}</strong>?</p>
<p><em>(Recuerda que si el cliente tiene casos asignados, el sistema no dejará borrarlo por protección).</em></p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'lista_clientes' %}">Cancelar</a>
</form>
{% endblock %}
